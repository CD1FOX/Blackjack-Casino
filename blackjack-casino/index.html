<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Casino</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contents">
        <div class="resources-display container">
            <button type="button" class="play-btn">Play</button>
        </div>

        <div class="main-container">
            <div class="head-container">
                <h1 class="header-name">BlackJack Casino</h1>
            </div>

            <div class="body-container container">
                <div class="entities-container">
                    <div class="entity">
                        <span class="entity-hand-value dealer-hand-value">dealer: 0</span>
                        <div class="entity-cards dealer-cards">
                        </div>
                    </div>

                    <div class="entity player">
                        <span class="entity-hand-value player-hand-value">player: 0</span>
                        <div class="entity-cards player-cards">
                        </div>
                    </div>
                </div>
            </div>

            <div class="buttons-container">
                <button type="button" class="hit-btn" disabled>Hit</button>
                <button type="button" class="stand-btn" disabled>Stand</button>
            </div>
        </div>
    </div>


    <script type="module" src="main.js"></script>
</body>

</html>
